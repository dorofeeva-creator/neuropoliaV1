<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НЕЙРОПОЛИЯ — игра для ординаторов неврологов</title>
    <style>
        /* === ГЛОБАЛЬНЫЕ СТИЛИ === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0a0a0f;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: 
                linear-gradient(135deg, 
                    rgba(6, 4, 18, 0.6) 0%, 
                    rgba(6, 4, 18, 0.4) 40%,
                    rgba(6, 4, 18, 0.55) 100%
                ),
                url('center_bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: subtleZoom 20s ease-in-out infinite alternate;
        }

        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, 
                    rgba(160, 120, 255, 0.04) 0%, 
                    transparent 50%
                ),
                radial-gradient(ellipse at 80% 70%, 
                    rgba(100, 80, 200, 0.03) 0%, 
                    transparent 50%
                );
            pointer-events: none;
        }

        .game-container {
            background: rgba(6, 4, 18, 0.85);
            backdrop-filter: blur(14px);
            border-radius: 44px;
            padding: 30px;
            border: 1px solid rgba(160, 140, 255, 0.08);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(200, 180, 255, 0.03),
                0 0 80px rgba(80, 40, 160, 0.04);
            max-width: 960px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* === ШАПКА === */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }

        .header-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px 24px;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 16px 4px 6px;
            border-radius: 50px;
            border: 1px solid rgba(160, 120, 255, 0.06);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .logo-container:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(160, 120, 255, 0.12);
            transform: scale(1.02);
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(160, 120, 255, 0.08);
            transition: all 0.3s ease;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.15;
        }

        .logo-text .org-name {
            font-size: 13px;
            font-weight: 600;
            color: rgba(200, 215, 255, 0.85);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .logo-text .org-subtitle {
            font-size: 9px;
            font-weight: 300;
            color: rgba(200, 215, 255, 0.35);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .brand-title {
            font-size: 44px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(to bottom, #ffffff 20%, #82b1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(130, 177, 255, 0.15);
            line-height: 1.1;
            flex-shrink: 0;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            font-size: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .header-stats div {
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
        }
        .header-stats .correct { color: #a5d6a7; }
        .header-stats .wrong { color: #ef9a9a; }

        /* === ВЫБОР УРОВНЯ === */
        #difficulty-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 32px;
            border: 1px solid rgba(160,120,255,0.08);
            gap: 24px;
            margin-bottom: 20px;
        }

        #difficulty-screen h2 {
            color: #e8eaf6;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .diff-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(160,120,255,0.15);
            color: #cfd8e6;
            padding: 18px 44px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
            min-width: 160px;
        }

        .diff-btn:hover {
            background: rgba(106, 63, 255, 0.2);
            border-color: #9b7aff;
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(106, 63, 255, 0.15);
        }

        .diff-btn.easy { border-color: #4caf50; }
        .diff-btn.easy:hover { background: rgba(76, 175, 80, 0.15); border-color: #66bb6a; }

        .diff-btn.medium { border-color: #ffa726; }
        .diff-btn.medium:hover { background: rgba(255, 167, 38, 0.15); border-color: #ffb74d; }

        /* === КАНВАС === */
        .track-wrapper {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 28px;
            padding: 12px;
            border: 1px solid rgba(160, 120, 255, 0.06);
            margin-bottom: 20px;
            box-shadow: inset 0 0 60px rgba(20, 10, 40, 0.5);
            position: relative;
            overflow: hidden;
        }

        #trackCanvas {
            width: 100%;
            height: auto;
            border-radius: 18px;
            display: block;
            cursor: default;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 0 1px rgba(160, 120, 255, 0.02);
        }

        /* === УПРАВЛЕНИЕ === */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 16px 26px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
        }

        .players-info {
            display: flex;
            gap: 40px;
            font-size: 18px;
            font-weight: 500;
        }
        .players-info .you { color: #82b1ff; }
        .players-info .bot { color: #ffab91; }

        .dice-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        #dice-result {
            font-size: 46px;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 22px;
            border-radius: 18px;
            min-width: 80px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            position: relative;
            border: 1px solid rgba(160, 120, 255, 0.06);
        }

        #dice-result.dice-roll {
            animation: dicePop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes dicePop {
            0% {
                transform: scale(0.4) rotate(-40deg);
                opacity: 0.2;
                background: rgba(124, 77, 255, 0.3);
                box-shadow: 0 0 0 0 rgba(124, 77, 255, 0.6);
            }
            40% {
                transform: scale(2.0) rotate(25deg);
                background: rgba(124, 77, 255, 0.4);
                box-shadow: 0 0 70px 40px rgba(124, 77, 255, 0.25);
            }
            70% {
                transform: scale(0.9) rotate(-6deg);
                background: rgba(255, 215, 0, 0.25);
                box-shadow: 0 0 50px 30px rgba(255, 215, 0, 0.15);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                background: rgba(255, 255, 255, 0.03);
                box-shadow: 0 0 0 0 transparent;
            }
        }

        #dice-result.dice-highlight {
            background: rgba(255, 215, 0, 0.2) !important;
            box-shadow: 0 0 60px 30px rgba(255, 215, 0, 0.15), inset 0 0 30px 10px rgba(255, 215, 0, 0.06) !important;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        #roll-btn {
            background: linear-gradient(145deg, #6a3fff, #4d2bcc);
            color: #fff;
            border: none;
            padding: 14px 38px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px rgba(106, 63, 255, 0.3);
            letter-spacing: 0.5px;
        }

        #roll-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px rgba(106, 63, 255, 0.45);
        }

        #roll-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* === МОДАЛЬНОЕ ОКНО (ВОПРОСЫ) === */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: rgba(6, 4, 18, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 42px;
            max-width: 640px;
            width: 95%;
            border: 1px solid rgba(160, 120, 255, 0.12);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6), 
                0 0 60px rgba(60, 30, 120, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .modal-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, 
                rgba(106, 63, 255, 0.04) 0%, 
                transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .modal-box .q-text {
            color: #e8eaf6;
            font-size: 21px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 60px;
            padding-left: 6px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #cfd8e6;
            border: 2px solid rgba(255, 255, 255, 0.06);
            padding: 16px 16px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            backdrop-filter: blur(4px);
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(106, 63, 255, 0.2);
            border-color: #9b7aff;
            color: #fff;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(106, 63, 255, 0.15);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none !important;
        }

        .option-btn .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(106, 63, 255, 0.2);
            border-radius: 50%;
            font-weight: 700;
            color: #9b7aff;
            margin-right: 14px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .option-btn.correct-answer {
            border-color: #66bb6a;
            background: rgba(102, 187, 106, 0.25);
            box-shadow: 0 0 40px rgba(102, 187, 106, 0.15);
        }
        .option-btn.wrong-answer {
            border-color: #ef5350;
            background: rgba(239, 83, 80, 0.25);
            box-shadow: 0 0 40px rgba(239, 83, 80, 0.15);
        }

        /* === МОДАЛЬНОЕ ОКНО (ЗАВЕРШЕНИЕ ИГРЫ) === */
        #gameover-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 1500;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        #gameover-overlay .modal-box {
            text-align: center;
            padding: 50px 42px;
            max-width: 520px;
        }

        #gameover-overlay .modal-box h2 {
            font-size: 38px;
            color: #ffd54f;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        #gameover-overlay .modal-box .winner-emoji {
            font-size: 72px;
            display: block;
            margin: 10px 0 20px;
        }

        #gameover-overlay .modal-box .game-stats {
            color: #cfd8e6;
            font-size: 18px;
            line-height: 2;
            margin: 20px 0 30px;
        }

        #gameover-overlay .modal-box .game-stats span {
            font-weight: 600;
        }

        .gameover-btn {
            background: linear-gradient(145deg, #6a3fff, #4d2bcc);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px rgba(106, 63, 255, 0.3);
            letter-spacing: 0.5px;
        }

        .gameover-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 40px rgba(106, 63, 255, 0.45);
        }

        /* === TOAST === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 4, 18, 0.96);
            color: #f0f4ff;
            padding: 18px 40px;
            border-radius: 60px;
            font-size: 18px;
            border-left: 6px solid #9b7aff;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: none;
            animation: slideUp 0.3s ease;
            max-width: 92%;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(160, 120, 255, 0.06);
        }

        .toast.success { border-left-color: #66bb6a; }
        .toast.error { border-left-color: #ef5350; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* === АДАПТИВ === */
        @media (max-width: 768px) {
            .game-container { padding: 16px; }
            .brand-title { font-size: 32px; letter-spacing: 2px; }
            .header-top { flex-direction: column; align-items: center; gap: 10px; }
            .logo-container { padding: 4px 12px 4px 6px; }
            .logo-icon { width: 36px; height: 36px; }
            .logo-text .org-name { font-size: 11px; white-space: normal; }
            .logo-text .org-subtitle { font-size: 8px; white-space: normal; }
            .options-grid { grid-template-columns: 1fr; }
            .modal-box { padding: 24px; }
            .controls { flex-direction: column; align-items: stretch; }
            .dice-area { justify-content: center; }
            .players-info { justify-content: center; gap: 20px; font-size: 16px; }
            .diff-btn { padding: 14px 24px; font-size: 18px; min-width: 120px; }
            #gameover-overlay .modal-box { padding: 30px 20px; }
            #gameover-overlay .modal-box h2 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="header-top">
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="rcnn_logo.png" alt="Российский центр неврологии и нейронаук">
                </div>
                <div class="logo-text">
                    <span class="org-name">РОССИЙСКИЙ ЦЕНТР НЕВРОЛОГИИ И НЕЙРОНАУК</span>
                    <span class="org-subtitle">Russian Center of Neurology and Neuroscience</span>
                </div>
            </div>
            <span class="brand-title">НЕЙРОПОЛИЯ</span>
        </div>

        <div class="header-stats">
            <div class="correct">✅ Верно: <span id="correct-count">0</span></div>
            <div class="wrong">❌ Неверно: <span id="wrong-count">0</span></div>
            <div style="color: #ce93d8;">🧠 Уровень: <span id="current-difficulty-label">—</span></div>
        </div>
    </div>

    <!-- ЭКРАН ВЫБОРА УРОВНЯ -->
    <div id="difficulty-screen">
        <h2>Выбери уровень сложности</h2>
        <div class="diff-buttons">
            <button class="diff-btn easy" data-level="easy">🟢 Лёгкий</button>
            <button class="diff-btn medium" data-level="medium">🟠 Средний</button>
        </div>
    </div>

    <!-- ИГРОВОЕ ПОЛЕ (скрыто до выбора уровня) -->
    <div id="game-board" style="display: none;">
        <div class="track-wrapper">
            <canvas id="trackCanvas" width="860" height="520"></canvas>
        </div>

        <div class="controls">
            <div class="players-info">
                <div class="you">🧑‍⚕️ Вы: <span id="player-pos">1</span>/<span id="total-cells-display">30</span></div>
                <div class="bot">🤖 Бот: <span id="bot-pos">1</span>/30</div>
            </div>
            <div class="dice-area">
                <span id="dice-result">⚀</span>
                <button id="roll-btn">🎲 Бросить</button>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО (ВОПРОСЫ) -->
<div id="modal-overlay">
    <div class="modal-box">
        <div class="q-text" id="q-text">Текст вопроса...</div>
        <div class="options-grid" id="options-container">
            <button class="option-btn" data-index="0"><span class="letter">А</span> <span class="opt-text">Вариант 1</span></button>
            <button class="option-btn" data-index="1"><span class="letter">Б</span> <span class="opt-text">Вариант 2</span></button>
            <button class="option-btn" data-index="2"><span class="letter">В</span> <span class="opt-text">Вариант 3</span></button>
            <button class="option-btn" data-index="3"><span class="letter">Г</span> <span class="opt-text">Вариант 4</span></button>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО (ЗАВЕРШЕНИЕ ИГРЫ) -->
<div id="gameover-overlay">
    <div class="modal-box">
        <span class="winner-emoji" id="gameover-emoji">🏆</span>
        <h2 id="gameover-title">ПОБЕДА!</h2>
        <div class="game-stats" id="gameover-stats">
            ✅ Верно: <span id="go-correct">0</span><br>
            ❌ Неверно: <span id="go-wrong">0</span>
        </div>
        <button class="gameover-btn" id="play-again-btn">🔄 Играть снова</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ============================================================
    //  БАЗА ВОПРОСОВ: ЛЁГКИЕ (120) + СРЕДНИЕ (60)
    // ============================================================
    const QUESTIONS_EASY = [
        // === 120 лёгких вопросов (оригинальные) ===
        { q: 'Поражение какой структуры приводит к формированию гомонимной гемианопсии?', opts: ['Зрительной лучистости', 'Зрительного тракта', 'Хиазмы', 'Зрительного нерва'], ans: 1 },
        { q: 'Назовите основной офтальмологический признак болезни Вильсона–Коновалова:', opts: ['Кольцо Кайзера–Флейшера', 'Пигментный ретинит', 'Отёк диска зрительного нерва', 'Артериовенозная перевязка'], ans: 0 },

        { q: 'Как называется синдром, развивающийся при поражении спинного мозга ниже уровня S3?', opts: ['Синдром поражения конского хвоста', 'Синдром поражения мозгового конуса', 'Синдром Броун-Секара', 'Эпиконус-синдром'], ans: 1 },
        { q: 'Опишите вынужденное положение глазного яблока при поражении глазодвигательного нерва:', opts: ['Поворот вверх и кнаружи', 'Поворот вниз и кнаружи', 'Поворот вверх и внутрь', 'Строго прямо (центральное положение)'], ans: 1 },
        { q: 'Как называется синдром, при котором наблюдается отсутствие реакции зрачка на свет при сохранении конвергенции и аккомодации?', opts: ['Синдром Клода Бернара-Горнера', 'Синдром Паррино', 'Синдром Аргайла-Робертсона', 'Синдром Ади'], ans: 2 },
        { q: 'При поражении какой структуры ствола мозга развивается синдром Вебера?', opts: ['Продолговатый мозг', 'Варолиев мост', 'Средний мозг', 'Таламус'], ans: 2 }
    ];

    // ============================================================
    //  ИГРОВОЙ ДВИЖОК
    // ============================================================
    const TOTAL_CELLS = 30;

    const trackPoints = [
        { x: 310, y: 500 }, { x: 380, y: 430 }, { x: 220, y: 450 }, { x: 170, y: 390 },
        { x: 110, y: 300 }, { x: 120, y: 160 }, { x: 190, y: 240 }, { x: 210, y: 330 },
        { x: 330, y: 350 }, { x: 430, y: 305 }, { x: 470, y: 410 }, { x: 560, y: 350 },
        { x: 470, y: 250 }, { x: 360, y: 210 }, { x: 260, y: 275 }, { x: 265, y: 160 },
        { x: 200, y: 100 }, { x: 285, y: 45 },  { x: 300, y: 130 }, { x: 440, y: 185 },
        { x: 560, y: 215 }, { x: 600, y: 300 }, { x: 680, y: 365 }, { x: 740, y: 290 },
        { x: 660, y: 255 }, { x: 720, y: 150 }, { x: 590, y: 65 },  { x: 490, y: 140 },
        { x: 360, y: 80 },  { x: 470, y: 35 }
    ];

    const players = [
        { name: 'Вы', pos: 0, color: '#82b1ff', id: 'p1', isBot: false },
        { name: 'Бот', pos: 0, color: '#ffab91', id: 'p2', isBot: true }
    ];

    let currentPlayerIndex = 0;
    let gameActive = false;
    let isWaitingForAnswer = false;
    let isBotThinking = false;
    let usedQuestions = [];
    let currentQuestion = null;
    let currentSteps = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let currentDifficulty = 'easy';
    let questionsPool = [];

    // DOM-элементы
    const difficultyScreen = document.getElementById('difficulty-screen');
    const gameBoard = document.getElementById('game-board');
    const diffLabel = document.getElementById('current-difficulty-label');
    const canvas = document.getElementById('trackCanvas');
    const ctx = canvas.getContext('2d');
    const rollBtn = document.getElementById('roll-btn');
    const diceResult = document.getElementById('dice-result');
    const modalOverlay = document.getElementById('modal-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const qText = document.getElementById('q-text');
    const optionBtns = document.querySelectorAll('.option-btn');
    const toast = document.getElementById('toast');
    let toastTimeout = null;

    // Загрузка изображения мозга
    const brainImage = new Image();
    brainImage.src = 'brain_bg.png';
    let brainLoaded = false;
    brainImage.onload = function() { brainLoaded = true; drawTrack(); };
    brainImage.onerror = function() { brainLoaded = true; drawTrack(); };

    // ============================================================
    //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function getCellPosition(index) {
        return trackPoints[Math.min(index, trackPoints.length - 1)];
    }

    function showToast(text, type = 'info', duration = 2600) {
        toast.textContent = text;
        toast.className = 'toast';
        if (type) toast.classList.add(type);
        toast.style.display = 'block';
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, duration);
    }

    function animateDice(value) {
        return new Promise((resolve) => {
            const diceSymbols = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            diceResult.classList.remove('dice-roll', 'dice-highlight');
            void diceResult.offsetWidth;
            diceResult.textContent = diceSymbols[value - 1];
            diceResult.classList.add('dice-roll', 'dice-highlight');
            setTimeout(() => {
                diceResult.classList.remove('dice-highlight');
                resolve();
            }, 1500);
        });
    }

    function getRandomQuestion() {
        if (usedQuestions.length >= questionsPool.length) {
            usedQuestions = [];
        }
        let available = [];
        for (let i = 0; i < questionsPool.length; i++) {
            if (!usedQuestions.includes(i)) available.push(i);
        }
        if (available.length === 0) {
            usedQuestions = [];
            available = questionsPool.map((_, i) => i);
        }
        const idx = available[Math.floor(Math.random() * available.length)];
        usedQuestions.push(idx);
        return questionsPool[idx];
    }

    // ============================================================
    //  ОТРИСОВКА КАНВАСА
    // ============================================================
    function drawNeuron(x, y, radius, number, isActive = false, isFinish = false) {
        const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 3.5);
        if (isFinish) {
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
            glow.addColorStop(0.5, 'rgba(255, 200, 50, 0.2)');
            glow.addColorStop(1, 'rgba(255, 200, 50, 0)');
        } else if (isActive) {
            glow.addColorStop(0, 'rgba(130, 177, 255, 0.6)');
            glow.addColorStop(0.5, 'rgba(130, 177, 255, 0.25)');
            glow.addColorStop(1, 'rgba(130, 177, 255, 0)');
        } else {
            glow.addColorStop(0, 'rgba(200, 220, 255, 0.3)');
            glow.addColorStop(0.5, 'rgba(180, 200, 255, 0.1)');
            glow.addColorStop(1, 'rgba(180, 200, 255, 0)');
        }
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius * 3.5, 0, Math.PI * 2);
        ctx.fill();

        const grad = ctx.createRadialGradient(x - radius*0.3, y - radius*0.3, 0, x, y, radius);
        if (isFinish) {
            grad.addColorStop(0, '#fff8e1');
            grad.addColorStop(0.3, '#ffd54f');
            grad.addColorStop(0.7, '#ffb300');
            grad.addColorStop(1, '#ff8f00');
        } else if (isActive) {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.3, '#b3d9ff');
            grad.addColorStop(0.7, '#4d9eff');
            grad.addColorStop(1, '#1a6bc4');
        } else {
            grad.addColorStop(0, '#f0f8ff');
            grad.addColorStop(0.3, '#b8d9ff');
            grad.addColorStop(0.7, '#6ba3e0');
            grad.addColorStop(1, '#2a6b9e');
        }
        ctx.shadowBlur = isFinish ? 45 : isActive ? 45 : 30;
        ctx.shadowColor = isFinish ? 'rgba(255, 200, 50, 0.9)' : isActive ? 'rgba(77, 158, 255, 0.8)' : 'rgba(100, 160, 220, 0.4)';
        ctx.fillStyle = grad;
        ctx.strokeStyle = isFinish ? '#ffd54f' : isActive ? '#4d9eff' : 'rgba(100, 160, 220, 0.5)';
        ctx.lineWidth = isFinish ? 3 : isActive ? 2.5 : 2;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        for (let i = 0; i < 10; i++) {
            const angle = (i / 10) * Math.PI * 2 + Math.random() * 0.2;
            const len = radius * (0.3 + Math.random() * 0.5);
            const endX = x + Math.cos(angle) * (radius + len);
            const endY = y + Math.sin(angle) * (radius + len);
            ctx.strokeStyle = isActive ? 'rgba(200, 230, 255, 0.6)' : isFinish ? 'rgba(255, 215, 0, 0.4)' : 'rgba(200, 220, 255, 0.3)';
            ctx.lineWidth = isActive ? 2 : 1.5;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(angle) * radius * 0.9, y + Math.sin(angle) * radius * 0.9);
            ctx.quadraticCurveTo(
                x + Math.cos(angle) * (radius + len * 0.5) + Math.sin(angle) * 4,
                y + Math.sin(angle) * (radius + len * 0.5) + Math.cos(angle) * 4,
                endX, endY
            );
            ctx.stroke();
            ctx.fillStyle = isActive ? 'rgba(255, 255, 255, 0.5)' : isFinish ? 'rgba(255, 215, 0, 0.3)' : 'rgba(200, 220, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(endX, endY, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        const nucleusGrad = ctx.createRadialGradient(x - 2, y - 2, 0, x, y, radius * 0.5);
        if (isFinish) {
            nucleusGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            nucleusGrad.addColorStop(1, 'rgba(255, 215, 0, 0.4)');
        } else if (isActive) {
            nucleusGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            nucleusGrad.addColorStop(1, 'rgba(130, 177, 255, 0.5)');
        } else {
            nucleusGrad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            nucleusGrad.addColorStop(1, 'rgba(180, 200, 255, 0.3)');
        }
        ctx.fillStyle = nucleusGrad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.45, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = isFinish ? '#5d4037' : isActive ? '#fff' : 'rgba(255, 255, 255, 0.9)';
        ctx.font = isFinish ? 'bold 13px Arial' : isActive ? 'bold 12px Arial' : '11px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(number || '', x, y + 1);
    }

    function drawPlayer(x, y, color, emoji, isMain) {
        const size = isMain ? 30 : 24;
        const glowSize = isMain ? 28 : 20;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
        grad.addColorStop(0, color + '90');
        grad.addColorStop(1, color + '00');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, glowSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = isMain ? 35 : 25;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.lineWidth = isMain ? 3 : 2.5;
        ctx.beginPath();
        ctx.arc(x, y, size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.font = `${isMain ? 18 : 14}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, x, y + 1);
    }

    function drawTrack() {
        const w = canvas.width, h = canvas.height;
        if (brainLoaded && brainImage.complete) {
            ctx.drawImage(brainImage, 0, 0, w, h);
            const grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, 350);
            grad.addColorStop(0, 'rgba(6, 4, 18, 0.05)');
            grad.addColorStop(0.5, 'rgba(6, 4, 18, 0.1)');
            grad.addColorStop(1, 'rgba(6, 4, 18, 0.25)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        } else {
            const grad = ctx.createRadialGradient(400, 250, 80, 400, 250, 500);
            grad.addColorStop(0, '#150a2a');
            grad.addColorStop(1, '#080418');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        for (let i = 0; i < trackPoints.length - 1; i++) {
            const p1 = trackPoints[i], p2 = trackPoints[i+1];
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(100, 160, 255, 0.3)';
            const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            grad.addColorStop(0, 'rgba(200, 220, 255, 0.4)');
            grad.addColorStop(0.3, 'rgba(230, 240, 255, 0.7)');
            grad.addColorStop(0.7, 'rgba(230, 240, 255, 0.7)');
            grad.addColorStop(1, 'rgba(200, 220, 255, 0.4)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.setLineDash([4, 10]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        trackPoints.forEach((p, i) => {
            const isFinish = (i === trackPoints.length - 1);
            const radius = isFinish ? 24 : 20;
            let hasPlayer = false;
            players.forEach(player => { if (player.pos === i) hasPlayer = true; });
            drawNeuron(p.x, p.y, radius, i + 1, hasPlayer, isFinish);
        });

        drawPlayers();
    }

    function drawPlayers() {
        const p1 = players[0], p2 = players[1];
        const pos1 = getCellPosition(p1.pos);
        const pos2 = getCellPosition(p2.pos);
        if (p2.pos < TOTAL_CELLS) drawPlayer(pos2.x, pos2.y, '#ffab91', '🤖', false);
        drawPlayer(pos1.x, pos1.y, '#82b1ff', '🧑‍⚕️', true);
        document.getElementById('player-pos').textContent = p1.pos + 1;
        document.getElementById('bot-pos').textContent = p2.pos + 1;
        document.getElementById('total-cells-display').textContent = TOTAL_CELLS;
        document.getElementById('correct-count').textContent = correctCount;
        document.getElementById('wrong-count').textContent = wrongCount;
    }

    // ============================================================
    //  ЛОГИКА ИГРЫ
    // ============================================================
    function showGameOver(winnerName) {
        gameActive = false;
        rollBtn.disabled = true;
        
        const emoji = document.getElementById('gameover-emoji');
        const title = document.getElementById('gameover-title');
        const goCorrect = document.getElementById('go-correct');
        const goWrong = document.getElementById('go-wrong');
        
        if (winnerName === 'Ты') {
            emoji.textContent = '🏆';
            title.textContent = 'ТЫ ПОБЕДИЛ!';
            title.style.color = '#ffd54f';
        } else {
            emoji.textContent = '🤖';
            title.textContent = 'БОТ ПОБЕДИЛ!';
            title.style.color = '#ffab91';
        }
        
        goCorrect.textContent = correctCount;
        goWrong.textContent = wrongCount;
        
        setTimeout(() => {
            gameoverOverlay.style.display = 'flex';
        }, 500);
    }

    function processAnswer(isCorrect, playerIndex) {
        const player = players[playerIndex];
        const isBot = player.isBot;

        if (isCorrect) {
            correctCount++;
            let newPos = player.pos + currentSteps;
            if (newPos >= TOTAL_CELLS - 1) {
                newPos = TOTAL_CELLS - 1;
                player.pos = newPos;
                drawTrack();
                modalOverlay.style.display = 'none';
                const winnerName = isBot ? 'Бот' : 'Ты';
                showGameOver(winnerName);
                return;
            }
            player.pos = newPos;
            const msg = isBot ? `✅ Бот ответил правильно! +${currentSteps} шагов` : `✅ Ты ответил правильно! +${currentSteps} шагов`;
            showToast(msg, 'success', 1800);
        } else {
            wrongCount++;
            const msg = isBot ? `❌ Бот ошибся! Остаётся на месте` : `❌ Неверно! Остаёшься на месте`;
            showToast(msg, 'error', 1800);
        }

        setTimeout(() => {
            modalOverlay.style.display = 'none';
            isWaitingForAnswer = false;
            if (!gameActive) return;
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            isBotThinking = false;
            drawTrack();
            if (gameActive && players[currentPlayerIndex].isBot) {
                setTimeout(() => botTurn(), 600);
            } else {
                rollBtn.disabled = false;
            }
        }, 1200);
    }

    function handleOptionClick(event) {
        const btn = event.currentTarget;
        if (!isWaitingForAnswer || !currentQuestion || isBotThinking) return;
        if (btn.disabled) return;
        const isCorrect = btn.dataset.correct === 'true';
        optionBtns.forEach(b => b.disabled = true);
        optionBtns.forEach(b => { if (b.dataset.correct === 'true') b.classList.add('correct-answer'); });
        if (!isCorrect) btn.classList.add('wrong-answer');
        processAnswer(isCorrect, 0);
    }

    function showQuestion(steps, forBot = false) {
        const questionData = getRandomQuestion();
        currentQuestion = questionData;
        currentSteps = steps;
        qText.textContent = questionData.q;
        optionBtns.forEach((btn, i) => {
            const textSpan = btn.querySelector('.opt-text');
            textSpan.textContent = questionData.opts[i] || '---';
            btn.dataset.correct = (i === questionData.ans) ? 'true' : 'false';
            btn.disabled = false;
            btn.className = 'option-btn';
        });
        modalOverlay.style.display = 'flex';
        if (forBot) {
            setTimeout(() => handleBotAnswer(), 900);
        } else {
            isWaitingForAnswer = true;
        }
    }

    function handleBotAnswer() {
        const isCorrect = Math.random() < 0.68;
        optionBtns.forEach(b => {
            b.disabled = true;
            if (b.dataset.correct === 'true') b.classList.add('correct-answer');
        });
        if (!isCorrect) {
            const wrongBtns = document.querySelectorAll('.option-btn:not(.correct-answer)');
            if (wrongBtns.length > 0) {
                const randomWrong = wrongBtns[Math.floor(Math.random() * wrongBtns.length)];
                randomWrong.classList.add('wrong-answer');
            }
        }
        processAnswer(isCorrect, 1);
    }

    function botTurn() {
        if (!gameActive || !players[currentPlayerIndex].isBot || isBotThinking) return;
        isBotThinking = true;
        rollBtn.disabled = true;
        const steps = Math.floor(Math.random() * 6) + 1;
        animateDice(steps).then(() => {
            showQuestion(steps, true);
        });
    }

    // ============================================================
    //  ВЫБОР УРОВНЯ
    // ============================================================
    function startGame(level) {
        currentDifficulty = level;
        diffLabel.textContent = level === 'easy' ? 'Лёгкий' : 'Средний';
        questionsPool = level === 'easy' ? QUESTIONS_EASY : QUESTIONS_MEDIUM;
        usedQuestions = [];

        // Сброс состояния
        players[0].pos = 0;
        players[1].pos = 0;
        correctCount = 0;
        wrongCount = 0;
        currentPlayerIndex = 0;
        gameActive = true;
        isWaitingForAnswer = false;
        isBotThinking = false;
        rollBtn.disabled = false;
        gameoverOverlay.style.display = 'none';

        difficultyScreen.style.display = 'none';
        gameBoard.style.display = 'block';
        drawTrack();
        showToast(`🧠 Уровень ${level === 'easy' ? 'Лёгкий' : 'Средний'} выбран! Игра началась!`, 'info', 3000);
    }

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const level = btn.dataset.level;
            startGame(level);
        });
    });

    // ============================================================
    //  ИГРАТЬ СНОВА
    // ============================================================
    document.getElementById('play-again-btn').addEventListener('click', () => {
        gameoverOverlay.style.display = 'none';
        gameBoard.style.display = 'none';
        difficultyScreen.style.display = 'flex';
        showToast('🔄 Выбери уровень для новой игры!', 'info', 2500);
    });

    // ============================================================
    //  УПРАВЛЕНИЕ БРОСКОМ
    // ============================================================
    rollBtn.addEventListener('click', async function() {
        if (!gameActive || isWaitingForAnswer || isBotThinking) return;
        const steps = Math.floor(Math.random() * 6) + 1;
        rollBtn.disabled = true;
        await animateDice(steps);
        showQuestion(steps, false);
    });

    optionBtns.forEach(btn => {
        btn.addEventListener('click', handleOptionClick);
    });

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    drawTrack();
    showToast('🧠 НЕЙРОПОЛИЯ: выбери уровень сложности!', 'info', 3000);
    console.log('НЕЙРОПОЛИЯ загружена. Лёгких:', QUESTIONS_EASY.length, 'Средних:', QUESTIONS_MEDIUM.length);
</script>
</body>
</html>
